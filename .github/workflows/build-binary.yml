name: Build csweb-tv binary only
on:
  workflow_dispatch:

jobs:
  binary:
    name: Build csweb-tv armv7 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/webos-ndk

      - name: Check out the kit
        run: bash tools/fetch-kit.sh

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/wnk/ffmpeg
          key: ffmpeg-webos-release-${{ hashFiles('tools/fetch-kit.sh', '.github/actions/webos-ndk/action.yml') }}

      - name: Configure (webos-release, csweb-tv only)
        working-directory: external/webos-native-app-kit
        env:
          WEBOS_NDK: ${{ env.WEBOS_NDK }}
        run: |
          cmake --preset webos-release -B build/webos-legacy \
            -DWNK_EXTRA_APP_DIRS="$GITHUB_WORKSPACE/apps/csweb-tv" \
            -DCSWEB_LEGACY=ON \
            -DWNK_BUILD_TESTS=OFF

      - name: Build csweb-tv binary
        working-directory: external/webos-native-app-kit
        run: |
          cmake --build build/webos-legacy --target csweb-tv -j$(nproc)
          file build/webos-legacy/extra-apps/csweb-tv/csweb-tv

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: csweb-tv-binary
          path: external/webos-native-app-kit/build/webos-legacy/extra-apps/csweb-tv/csweb-tv
          retention-days: 1
